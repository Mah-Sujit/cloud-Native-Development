<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard • Multimedia Sharing</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg1: #0b1220;
        --bg2: #0b1b2b;
        --card: rgba(255, 255, 255, 0.08);
        --card-border: rgba(255, 255, 255, 0.12);
        --text: #e5e7eb;
        --muted: rgba(229, 231, 235, 0.72);
        --shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
        --radius: 16px;
      }

      body {
        min-height: 100vh;
        color: var(--text);
        background: radial-gradient(1200px 600px at 10% 10%, rgba(99, 102, 241, 0.35), transparent 60%),
          radial-gradient(900px 500px at 90% 20%, rgba(14, 165, 233, 0.25), transparent 55%),
          linear-gradient(180deg, var(--bg1), var(--bg2));
      }

      .glass {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .login-wrap {
        min-height: calc(100vh - 40px);
        display: grid;
        place-items: center;
        padding: 20px 0;
      }

      .brand-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--card-border);
        background: rgba(255, 255, 255, 0.06);
        font-size: 12px;
        color: var(--muted);
      }

      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #a5b4fc, #4f46e5);
        box-shadow: 0 0 0 6px rgba(79, 70, 229, 0.15);
      }

      .form-control {
        background: rgba(255, 255, 255, 0.06) !important;
        border: 1px solid rgba(255, 255, 255, 0.18) !important;
        color: var(--text) !important;
        border-radius: 12px;
      }

      .form-control::placeholder {
        color: rgba(229, 231, 235, 0.45);
      }

      .btn-primary {
        border: none;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
        background: linear-gradient(135deg, #6366f1, #0ea5e9);
        box-shadow: 0 12px 25px rgba(99, 102, 241, 0.25);
      }

      .btn-outline-secondary {
        border-radius: 12px;
        border-color: rgba(255, 255, 255, 0.25);
        color: rgba(229, 231, 235, 0.9);
      }

      .topbar {
        padding: 14px 16px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .helper {
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <div class="container py-3">
      <!-- LOGIN -->
      <div id="loginSection" class="login-wrap">
        <div class="w-100" style="max-width: 420px;">
          <div class="text-center mb-3">
            <div class="brand-badge mb-3">
              <span class="brand-dot"></span>
              <span>EduVerse • Multimedia</span>
            </div>
            <h2 class="fw-bold mb-1">Multimedia Sharing</h2>
            <div class="helper">Login to upload and browse assets</div>
          </div>

          <div class="glass p-3">
            <div class="mb-3">
              <label for="loginUserId" class="form-label">User ID</label>
              <input id="loginUserId" class="form-control" placeholder="e.g. 1" />
            </div>

            <div class="mb-3">
  <label for="loginPassword" class="form-label">Password</label>
  <input
    id="loginPassword"
    type="password"
    class="form-control"
    placeholder="Your password"
  />
</div>

<div class="d-flex justify-content-between align-items-center mt-3">
  <span class="helper">New user?</span>
  <a href="./register.html" class="btn btn-outline-secondary btn-sm">
    Register
  </a>
</div>


            <button id="loginBtn" class="btn btn-primary w-100">Login</button>
            <div id="loginStatus" class="small text-warning mt-2"></div>
          </div>
        </div>
      </div>

      <!-- DASHBOARD -->
      <div id="appSection" style="display:none;">
        <div class="glass topbar mb-3">
          <div>
            <div class="brand-badge">
              <span class="brand-dot"></span>
              <span>EduVerse • Multimedia</span>
            </div>
            <div class="mt-2 helper">
              Logged in as: <b><span id="loggedInUser"></span></b>
            </div>
          </div>

          <div class="d-flex gap-2">
            <a href="./gallery.html" class="btn btn-primary btn-sm">View Images</a>
            <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Logout</button>
          </div>
        </div>

        <div class="glass p-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="fw-bold">Upload</div>
            <div class="helper">Blob + NoSQL metadata</div>
          </div>

          <form id="newAssetForm" onsubmit="return false;">
            <div class="mb-3">
              <label for="FileName" class="form-label">File Name</label>
              <input id="FileName" class="form-control" placeholder="e.g. lecture-1" />
            </div>

            <div class="mb-3">
              <label for="userID" class="form-label">User Id</label>
              <input id="userID" class="form-control" />
            </div>

            <div class="mb-3">
              <label for="userName" class="form-label">User Name</label>
              <input id="userName" class="form-control" />
            </div>

            <div class="mb-3">
              <label for="UpFile" class="form-label">File to Upload</label>
              <input id="UpFile" type="file" class="form-control" />
            </div>

            <!-- ✅ Feature #1: Progress bar -->
            <div class="progress mb-2" style="height: 12px; border-radius: 999px; overflow:hidden;">
              <div
                id="uploadProgress"
                class="progress-bar"
                role="progressbar"
                style="width:0%"
                aria-valuemin="0"
                aria-valuemax="100"
              ></div>
            </div>
            <div id="status" class="helper mb-3">Ready</div>

            <button id="subNewForm" type="button" class="btn btn-primary w-100">
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./JS/app.js"></script>
  </body>
</html>
